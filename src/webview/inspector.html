<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none';
    style-src {{cspSource}} 'unsafe-inline';
    script-src 'nonce-{{nonce}}';" />
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #0D1117;
            color: #C9D1D9;
            font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
        }

        .row label {
            width: 16px;
            color: #A78BFA;
            text-align: center;
            font-weight: 600;
        }

        .row input {
            flex: 1;
            background: #161B22;
            border: 1px solid #30363D;
            color: #C9D1D9;
            padding: 3px 6px;
            border-radius: 3px;
            font: inherit;
            transition: border-color .15s;
        }

        .row input:focus {
            outline: none;
            border-color: #A78BFA;
            box-shadow: 0 0 0 1px #A78BFA55;
        }

        .row input[type="color"] {
            padding: 0;
            height: 22px;
        }

        .empty {
            padding: 24px 12px;
            text-align: center;
            color: #6E7681;
            font-style: italic;
        }

        .name {
            padding: 8px 10px;
            color: #FFFFFF;
            border-bottom: 1px solid #21262D;
            background: #161B22;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .name input {
            flex: 1;
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            font: inherit;
            font-weight: 600;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .name input:focus {
            outline: none;
            border-color: #A78BFA;
            background: #0D1117;
        }

        .name .type {
            color: #6E7681;
            font-weight: 400;
            font-size: 11px;
        }

        .comp {
            margin: 8px;
            border: 1px solid #21262D;
            border-radius: 4px;
            overflow: hidden;
        }

        .comp-head {
            background: #161B22;
            padding: 5px 8px;
            font-size: 11px;
            color: #A78BFA;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .comp-body {
            padding: 6px 4px;
        }

        .multi-badge {
            margin: 8px;
            padding: 6px 10px;
            background: #6B46C1;
            color: white;
            border-radius: 4px;
            text-align: center;
            font-size: 11px;
        }

        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            margin-left: 4px;
            box-shadow: 0 0 4px #22c55e88;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>

<body>
    <div id="root">
        <div class="empty">No selection</div>
    </div>
    <script nonce="{{nonce}}">
        const vscode = acquireVsCodeApi();
        const root = document.getElementById('root');

        let current = null;
        let isMulti = false;
        let count = 0;

        let focusedFieldId = null;

        const pending = new Map();
        let flushTimer = null;
        const THROTTLE_MS = 16;

        function scheduleUpdate(nodeId, channel, axis, value) {
            const key = `${nodeId}:${channel}:${axis}`;
            pending.set(key, { nodeId, channel, axis, value });
            if (flushTimer) return;
            flushTimer = setTimeout(() => {
                flushTimer = null;
                for (const msg of pending.values()) {
                    vscode.postMessage({
                        type: 'update:transform',
                        nodeId: msg.nodeId,
                        channel: msg.channel,
                        axis: msg.axis,
                        value: msg.value,
                        live: true,
                    });
                }
                pending.clear();
            }, THROTTLE_MS);
        }

        function formatNum(v) {
            if (typeof v !== 'number' || !Number.isFinite(v)) return '0';
            const s = v.toFixed(6).replace(/\.?0+$/, '');
            return s === '' || s === '-' ? '0' : s;
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        const AXES = ['x', 'y', 'z'];
        const CHANNELS = [
            { key: 'position', label: 'Position' },
            { key: 'rotation', label: 'Rotation' },
            { key: 'scale', label: 'Scale' },
        ];

        function renderTransform() {
            let html = '<div class="comp">';
            html += '<div class="comp-head">Transform <span class="live-dot" title="Live sync"></span></div>';
            html += '<div class="comp-body">';
            for (const ch of CHANNELS) {
                for (const ax of AXES) {
                    const v = current.transform[ch.key][ax];
                    const val = formatNum(v);
                    html += `<div class="row">
            <label>${ax.toUpperCase()}</label>
            <input type="number" step="any"
              data-ch="${ch.key}" data-ax="${ax}"
              value="${val}" />
          </div>`;
                }
            }
            html += '</div></div>';
            return html;
        }

        function renderComponents() {
            let html = '';
            for (const c of current.components || []) {
                const title = c.type.charAt(0).toUpperCase() + c.type.slice(1);
                html += '<div class="comp">';
                html += `<div class="comp-head">${esc(title)}</div>`;
                html += '<div class="comp-body">';
                const entries = Object.entries(c).filter(([k]) => k !== 'id' && k !== 'type');
                for (const [k, v] of entries) {
                    const display = typeof v === 'object' ? JSON.stringify(v) : String(v);
                    html += `<div class="row">
            <label>${esc(k.charAt(0))}</label>
            <input type="text" disabled value="${esc(display)}" />
          </div>`;
                }
                html += '</div></div>';
            }
            return html;
        }

        function updateTransformValues() {
            if (!current) return;
            for (const ch of CHANNELS) {
                for (const ax of AXES) {
                    const inp = root.querySelector(`input[data-ch="${ch.key}"][data-ax="${ax}"]`);
                    if (!inp) continue;
                    if (document.activeElement === inp) continue;
                    const newStr = formatNum(current.transform[ch.key][ax]);
                    if (inp.value !== newStr) {
                        inp.value = newStr;
                    }
                }
            }
        }

        function renderFull() {
            if (!current) {
                root.innerHTML = '<div class="empty">No selection</div>';
                focusedFieldId = null;
                return;
            }

            let html = '';
            if (isMulti) {
                html += `<div class="multi-badge">${count} nodes selected — showing primary</div>`;
            }

            html += `<div class="name">
        <input type="text" id="nameInput" value="${esc(current.name)}" />
        <span class="type">${esc(current.id.slice(0, 12))}</span>
      </div>`;

            html += renderTransform();
            html += renderComponents();
            root.innerHTML = html;

            bindInputs();
        }

        function bindInputs() {
            root.querySelectorAll('input[data-ch]').forEach(inp => {
                const fid = `${inp.dataset.ch}.${inp.dataset.ax}`;

                if (focusedFieldId === fid) {
                    inp.focus();
                    const len = inp.value.length;
                    inp.setSelectionRange(len, len);
                }

                inp.addEventListener('focus', () => { focusedFieldId = fid; });
                inp.addEventListener('blur', () => { focusedFieldId = null; });

                inp.addEventListener('input', () => {
                    const raw = inp.value.trim();
                    if (raw === '' || raw === '-' || raw === '.') return;

                    const parsed = parseFloat(raw);
                    if (!Number.isFinite(parsed)) return;

                    if (current) {
                        current.transform[inp.dataset.ch][inp.dataset.ax] = parsed;
                    }

                    scheduleUpdate(current.id, inp.dataset.ch, inp.dataset.ax, parsed);
                });

                inp.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (flushTimer) clearTimeout(flushTimer);
                        flushTimer = null;
                        for (const msg of pending.values()) {
                            vscode.postMessage({
                                type: 'update:transform',
                                nodeId: msg.nodeId,
                                channel: msg.channel,
                                axis: msg.axis,
                                value: msg.value,
                                live: false,
                            });
                        }
                        pending.clear();
                        inp.blur();
                    }

                    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                        const step = e.shiftKey ? 1 : (e.ctrlKey || e.metaKey ? 0.01 : 0.1);
                        const dir = e.key === 'ArrowUp' ? 1 : -1;
                        const cur = parseFloat(inp.value) || 0;
                        const next = +(cur + dir * step).toFixed(6);
                        inp.value = formatNum(next);
                        inp.dispatchEvent(new Event('input', { bubbles: true }));
                        e.preventDefault();
                    }
                });
            });

            const nameInput = document.getElementById('nameInput');
            nameInput?.addEventListener('focus', () => { focusedFieldId = '__name__'; });
            nameInput?.addEventListener('blur', () => { focusedFieldId = null; });
            nameInput?.addEventListener('change', () => {
                const v = nameInput.value.trim();
                if (v === '' || !current || v === current.name) return;
                vscode.postMessage({ type: 'rename', nodeId: current.id, name: v });
            });
        }

        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (msg.type !== 'inspect') return;

            const newPayload = msg.payload;

            if (current && newPayload && current.id === newPayload.id) {
                current = newPayload;
                isMulti = msg.multi || false;
                count = msg.count || 0;
                updateTransformValues();
                return;
            }

            current = newPayload;
            isMulti = msg.multi || false;
            count = msg.count || 0;
            renderFull();
        });
    </script>
</body>

</html>
