<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none';
           style-src {{cspSource}} 'unsafe-inline';
           script-src 'nonce-{{nonce}}' https://cdn.babylonjs.com 'unsafe-eval';
           connect-src https://cdn.babylonjs.com;
           worker-src blob:;" />
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #1a1f2e;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #viewport {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #0D1117;
      border-bottom: 1px solid #21262D;
      z-index: 20;
      user-select: none;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
    }

    #toolbar::-webkit-scrollbar {
      height: 4px;
    }

    #toolbar::-webkit-scrollbar-thumb {
      background: #30363D;
      border-radius: 2px;
    }

    .tb-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
      border-right: 1px solid #21262D;
    }

    .tb-group:last-child {
      border-right: none;
    }

    .tb-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 28px;
      height: 26px;
      padding: 0 6px;
      background: transparent;
      border: 1px solid transparent;
      color: #8B949E;
      font: 12px/1 ui-monospace, monospace;
      border-radius: 4px;
      cursor: pointer;
      transition: all .12s;
    }

    .tb-btn:hover {
      background: #161B22;
      color: #C9D1D9;
    }

    .tb-btn.active {
      background: #6B46C1;
      color: #FFFFFF;
      border-color: #A78BFA;
      box-shadow: 0 0 0 1px #A78BFA55 inset;
    }

    .tb-btn .icon {
      font-size: 14px;
      line-height: 1;
    }

    .tb-btn .label {
      font-size: 11px;
    }

    .tb-label {
      color: #6E7681;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 4px;
    }

    .tb-dd-wrap {
      position: relative;
    }

    .tb-dd-menu {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 4px;
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 4px;
      padding: 4px;
      min-width: 140px;
      display: none;
      z-index: 100;
      box-shadow: 0 4px 12px #0008;
    }

    .tb-dd-wrap.open .tb-dd-menu {
      display: block;
    }

    .tb-dd-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      color: #C9D1D9;
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
    }

    .tb-dd-item:hover {
      background: #6B46C1;
    }

    .tb-dd-item .icon {
      font-size: 14px;
      width: 16px;
      text-align: center;
    }

    #canvas-wrap {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
      cursor: default;
    }

    #renderCanvas.look-mode {
      cursor: none;
    }

    #hud {
      position: absolute;
      top: 8px;
      left: 8px;
      color: #A78BFA;
      font: 12px/1.6 monospace;
      pointer-events: none;
      background: rgba(13, 17, 23, .75);
      padding: 8px 12px;
      border-radius: 4px;
      z-index: 10;
      line-height: 1.8;
    }

    #hud b {
      color: #fff;
    }

    #hud .k {
      color: #6BFF8F;
      font-weight: bold;
    }

    #hud .k.on {
      color: #FFA500;
    }

    #fps {
      position: absolute;
      top: 8px;
      right: 8px;
      color: #6BFF8F;
      font: 12px/1.6 monospace;
      pointer-events: none;
      background: rgba(13, 17, 23, .75);
      padding: 6px 10px;
      border-radius: 4px;
      z-index: 10;
    }

    #status {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #6BFF8F;
      font: 11px monospace;
      pointer-events: none;
      background: rgba(13, 17, 23, .8);
      padding: 4px 12px;
      border-radius: 4px;
      z-index: 10;
      transition: color .15s;
      white-space: nowrap;
    }

    #status.off {
      color: #6E7681;
    }

    #status.look {
      color: #FFA500;
      font-weight: bold;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #A78BFA;
      font: 14px monospace;
      z-index: 5;
      background: #1a1f2e;
    }

    #look-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      display: none;
    }

    #look-overlay.active {
      display: block;
      box-shadow: inset 0 0 0 2px #FFA500;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9;
      display: none;
    }

    #crosshair.active {
      display: block;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #FFA500;
      box-shadow: 0 0 4px #FFA50088;
    }

    #crosshair::before {
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1.5px;
      transform: translateX(-50%);
    }

    #crosshair::after {
      top: 50%;
      left: 0;
      right: 0;
      height: 1.5px;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
  <div id="viewport">
    <div id="toolbar">
      <div class="tb-group">
        <div class="tb-dd-wrap" id="addObjWrap">
          <button class="tb-btn" id="addObjBtn" title="Add Object">
            <span class="icon">＋</span>
            <span class="label">Add</span>
          </button>
          <div class="tb-dd-menu" id="addObjMenu"></div>
        </div>
      </div>

      <div class="tb-group" id="transformGroup">
        <span class="tb-label">Gizmo</span>
      </div>

      <div class="tb-group" id="refGroup">
        <span class="tb-label">Space</span>
      </div>

      <div class="tb-group" id="shaderGroup">
        <span class="tb-label">View</span>
      </div>

      <div class="tb-group" id="snapGroup">
        <span class="tb-label">Snap</span>
      </div>

      <div class="tb-group">
        <button class="tb-btn" id="lookModeBtn" title="Toggle Look Mode (F)">
          <span class="icon">👁</span>
          <span class="label">Look</span>
        </button>
      </div>
    </div>

    <div id="canvas-wrap">
      <div id="look-overlay"></div>
      <div id="crosshair"></div>
      <div id="hud">
        <b>Weaver Viewport</b><br />
        <span class="k" id="hudLookKey">F</span> toggle look mode &nbsp; <span class="k">IJKL</span>/<span
          class="k">Arrows</span> look<br />
        <span class="k">WASD</span> move &nbsp; <span class="k">Q/E</span> down/up<br />
        <span class="k">Shift</span> fast &nbsp; <span class="k">Space</span> slow &nbsp; <span class="k">Wheel</span>
        speed<br />
        <span class="k">LMB</span> select &nbsp; <span class="k">Esc</span> deselect &nbsp; <span class="k">Del</span>
        delete
      </div>
      <div id="fps">-- FPS</div>
      <div id="status" class="off">● F to look · WASD to move</div>
      <div id="loading">Loading Babylon…</div>
      <canvas id="renderCanvas" tabindex="0"></canvas>
    </div>
  </div>

  <script nonce="{{nonce}}" src="https://cdn.babylonjs.com/babylon.js"></script>
  <script nonce="{{nonce}}">
    const vscode = acquireVsCodeApi();

    const canvas = document.getElementById('renderCanvas');
    const hud = document.getElementById('hud');
    const hudLookKey = document.getElementById('hudLookKey');
    const fpsEl = document.getElementById('fps');
    const statusEl = document.getElementById('status');
    const loading = document.getElementById('loading');
    const toolbar = document.getElementById('toolbar');
    const addObjWrap = document.getElementById('addObjWrap');
    const addObjBtn = document.getElementById('addObjBtn');
    const addObjMenu = document.getElementById('addObjMenu');
    const transformGroup = document.getElementById('transformGroup');
    const refGroup = document.getElementById('refGroup');
    const shaderGroup = document.getElementById('shaderGroup');
    const snapGroup = document.getElementById('snapGroup');
    const lookModeBtn = document.getElementById('lookModeBtn');
    const lookOverlay = document.getElementById('look-overlay');
    const crosshair = document.getElementById('crosshair');

    let engine, scene, camera, highlightLayer, gizmoManager;
    const nodeIdToMesh = new Map();
    const nodeIdToRoot = new Map();
    const rootToNodeId = new Map();
    const meshToNodeId = new WeakMap();
    let selectedIds = [];
    let hoveredMesh = null;

    let suppressGizmoSync = false;
    let config = null;

    const editor = {
      transformMode: 'move',
      referenceMode: 'world',
      shaderMode: 'solid',
      snapGrid: false,
      snapGridSize: 0.5,
      snapObject: false,
    };

    const camState = {
      yaw: -Math.PI / 4,
      pitch: -Math.PI / 8,
      baseSpeed: 0.35,
      baseLookSpeed: 1.8,
      sprintMult: 4,
      slowMult: 0.25,
    };

    const keys = new Set();
    let shiftHeld = false;
    let spaceHeld = false;

    let lookMode = false;
    let pointerLocked = false;
    const MOUSE_SENS = 0.0035;

    let HOVER_COLOR = new BABYLON.Color3(0.4, 0.75, 1.0);
    let SELECT_COLOR = new BABYLON.Color3(1.0, 0.6, 0.15);

    // ⭐ track gizmoهایی که listener بهشون بسته شده
    const gizmoListenersAttached = new WeakSet();

    function log(...a) { console.log('[Weaver]', ...a); }

    function setStatus(text, active, isLook) {
      statusEl.textContent = text;
      statusEl.classList.toggle('off', !active);
      statusEl.classList.toggle('look', !!isLook);
    }

    function enterLookMode() {
      if (lookMode) return;
      lookMode = true;
      canvas.classList.add('look-mode');
      lookOverlay.classList.add('active');
      crosshair.classList.add('active');
      lookModeBtn.classList.add('active');
      hudLookKey.classList.add('on');
      setStatus('● LOOK MODE — press F to exit', true, true);

      const p = canvas.requestPointerLock?.({ unadjustedMovement: true });
      if (p && p.catch) {
        p.catch(() => canvas.requestPointerLock());
      }
      canvas.focus();
      log('look mode ON');
    }

    function exitLookMode() {
      if (!lookMode) return;
      lookMode = false;
      canvas.classList.remove('look-mode');
      lookOverlay.classList.remove('active');
      crosshair.classList.remove('active');
      lookModeBtn.classList.remove('active');
      hudLookKey.classList.remove('on');
      setStatus('● F to look · WASD to move', false, false);

      keys.clear();
      shiftHeld = false;
      spaceHeld = false;

      if (pointerLocked) {
        document.exitPointerLock?.();
      }
      log('look mode OFF');
    }

    function toggleLookMode() {
      if (lookMode) exitLookMode();
      else enterLookMode();
    }

    document.addEventListener('pointerlockchange', () => {
      pointerLocked = document.pointerLockElement === canvas;
      if (lookMode && !pointerLocked) {
        exitLookMode();
      }
    });

    document.addEventListener('pointerlockerror', () => {
      log('pointerlock error');
    });

    window.addEventListener('message', (e) => {
      const msg = e.data;

      if (msg.type === 'scene:update') {
        if (scene) {
          if (msg.payload.config) applySceneConfig(msg.payload.config);
          rebuildScene(msg.payload);
        }
      } else if (msg.type === 'selection:update') {
        applySelection(msg.ids || []);
      } else if (msg.type === 'transform:apply') {
        applyTransformFromInspector(msg.payload);
      } else if (msg.type === 'config:resolved') {
        applySceneConfig(msg.payload);
      } else if (msg.type === 'error') {
        loading.textContent = 'Error: ' + msg.message;
      }
    });

    window.addEventListener('load', () => {
      if (typeof BABYLON === 'undefined') {
        loading.textContent = 'Failed to load Babylon';
        return;
      }
      loading.remove();
      log('init');

      engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.15, 0.18, 0.24, 1);

      camera = new BABYLON.FreeCamera('__editor_camera', new BABYLON.Vector3(8, 6, -10), scene);
      camera.minZ = 0.05;
      camera.maxZ = 5000;
      camera.fov = 0.9;
      applyRotation();

      const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, -0.3), scene);
      sun.intensity = 1.2;
      const amb = new BABYLON.HemisphericLight('amb', new BABYLON.Vector3(0, 1, 0), scene);
      amb.intensity = 0.8;

      const grid = BABYLON.MeshBuilder.CreateGround('__grid', { width: 100, height: 100 }, scene);
      try {
        const gm = new BABYLON.GridMaterial('__gm', scene);
        gm.majorUnitFrequency = 10;
        gm.minorUnitVisibility = 0.35;
        gm.mainColor = new BABYLON.Color3(0.3, 0.33, 0.4);
        gm.lineColor = new BABYLON.Color3(0.5, 0.52, 0.6);
        grid.material = gm;
      } catch {
        const sm = new BABYLON.StandardMaterial('__sm', scene);
        sm.diffuseColor = new BABYLON.Color3(0.2, 0.22, 0.28);
        grid.material = sm;
      }
      grid.isPickable = false;

      highlightLayer = new BABYLON.HighlightLayer('__hl', scene);
      highlightLayer.innerGlow = false;
      highlightLayer.outerGlow = true;

      setupGizmo();
      setupGizmoSync();
      setupInput();
      setupPicking();

      engine.runRenderLoop(() => {
        updateCamera(engine.getDeltaTime() / 1000);
        applySnap();
        scene.render();
        fpsEl.textContent = engine.getFps().toFixed(0) + ' FPS';
      });

      window.addEventListener('resize', () => engine.resize());
      setTimeout(() => engine.resize(), 100);

      canvas.focus();
      vscode.postMessage({ type: 'ready' });
    });

    const DEFAULT_CONFIG = {
      toolbar: {
        enabled: { addObjects: true, transformModes: true, referenceModes: true, shaderModes: true, snap: true },
        transformMode: 'move',
        referenceMode: 'world',
        shaderMode: 'solid',
        snapGrid: false,
        snapGridSize: 0.5,
        snapObject: false,
        addObjects: [],
        transformModes: [],
        referenceModes: [],
        shaderModes: [],
      },
      camera: { baseSpeed: 0.35, baseLookSpeed: 1.8, sprintMult: 4, slowMult: 0.25 },
      highlights: {
        hover: { r: 0.40, g: 0.75, b: 1.00 },
        selected: { r: 1.00, g: 0.60, b: 0.15 },
      },
      gizmo: { scaleRatio: 1.0 },
    };

    function applySceneConfig(raw) {
      if (!raw) return;

      config = {
        toolbar: { ...DEFAULT_CONFIG.toolbar, ...(raw.toolbar || {}) },
        camera: { ...DEFAULT_CONFIG.camera, ...(raw.camera || {}) },
        highlights: {
          hover: { ...DEFAULT_CONFIG.highlights.hover, ...(raw.highlights?.hover || {}) },
          selected: { ...DEFAULT_CONFIG.highlights.selected, ...(raw.highlights?.selected || {}) },
        },
        gizmo: { ...DEFAULT_CONFIG.gizmo, ...(raw.gizmo || {}) },
      };
      config.toolbar.enabled = { ...DEFAULT_CONFIG.toolbar.enabled, ...(raw.toolbar?.enabled || {}) };

      HOVER_COLOR = new BABYLON.Color3(config.highlights.hover.r, config.highlights.hover.g, config.highlights.hover.b);
      SELECT_COLOR = new BABYLON.Color3(config.highlights.selected.r, config.highlights.selected.g, config.highlights.selected.b);

      camState.baseSpeed = config.camera.baseSpeed;
      camState.baseLookSpeed = config.camera.baseLookSpeed;
      camState.sprintMult = config.camera.sprintMult;
      camState.slowMult = config.camera.slowMult;

      editor.transformMode = config.toolbar.transformMode || 'move';
      editor.referenceMode = config.toolbar.referenceMode || 'world';
      editor.shaderMode = config.toolbar.shaderMode || 'solid';
      editor.snapGrid = config.toolbar.snapGrid ?? false;
      editor.snapGridSize = config.toolbar.snapGridSize ?? 0.5;
      editor.snapObject = config.toolbar.snapObject ?? false;

      if (gizmoManager) {
        const ratio = config.gizmo.scaleRatio;
        if (gizmoManager.gizmos.positionGizmo) gizmoManager.gizmos.positionGizmo.scaleRatio = ratio;
        if (gizmoManager.gizmos.rotationGizmo) gizmoManager.gizmos.rotationGizmo.scaleRatio = ratio;
        if (gizmoManager.gizmos.scaleGizmo) gizmoManager.gizmos.scaleGizmo.scaleRatio = ratio;
      }

      buildToolbar();
    }

    function clearGroup(group, keepLabels) {
      const kids = Array.from(group.children);
      for (const k of kids) {
        if (keepLabels && k.classList.contains('tb-label')) continue;
        group.removeChild(k);
      }
    }

    function buildToolbar() {
      if (!config) return;

      clearGroup(addObjWrap);
      clearGroup(transformGroup, true);
      clearGroup(refGroup, true);
      clearGroup(shaderGroup, true);
      clearGroup(snapGroup, true);

      const en = config.toolbar.enabled;

      if (en.addObjects) {
        addObjWrap.style.display = '';
        addObjMenu.innerHTML = '';
        for (const item of config.toolbar.addObjects || []) {
          const el = document.createElement('div');
          el.className = 'tb-dd-item';
          el.innerHTML = '<span class="icon">' + item.icon + '</span>' + item.label;
          el.addEventListener('click', () => {
            addObject(item.geometry);
            addObjWrap.classList.remove('open');
          });
          addObjMenu.appendChild(el);
        }
        addObjBtn.onclick = (e) => {
          e.stopPropagation();
          addObjWrap.classList.toggle('open');
        };
      } else {
        addObjWrap.style.display = 'none';
      }

      if (en.transformModes) {
        transformGroup.style.display = '';
        for (const m of config.toolbar.transformModes || []) {
          const btn = makeButton(m.icon, m.label, () => setTransformMode(m.id), m.id === editor.transformMode);
          btn.dataset.mode = m.id;
          transformGroup.appendChild(btn);
        }
      } else {
        transformGroup.style.display = 'none';
      }

      if (en.referenceModes) {
        refGroup.style.display = '';
        for (const m of config.toolbar.referenceModes || []) {
          const btn = makeButton(m.icon, m.label, () => setReferenceMode(m.id), m.id === editor.referenceMode);
          btn.dataset.mode = m.id;
          refGroup.appendChild(btn);
        }
      } else {
        refGroup.style.display = 'none';
      }

      if (en.shaderModes) {
        shaderGroup.style.display = '';
        for (const m of config.toolbar.shaderModes || []) {
          const btn = makeButton(m.icon, m.label, () => setShaderMode(m.id), m.id === editor.shaderMode);
          btn.dataset.mode = m.id;
          shaderGroup.appendChild(btn);
        }
      } else {
        shaderGroup.style.display = 'none';
      }

      if (en.snap) {
        snapGroup.style.display = '';
        const snapGridBtn = makeButton('▦', 'Grid', () => toggleSnapGrid(), editor.snapGrid);
        snapGridBtn.title = 'Snap to Grid (' + editor.snapGridSize + ')';
        snapGridBtn.dataset.snap = 'grid';
        snapGroup.appendChild(snapGridBtn);

        const snapObjBtn = makeButton('⬡', 'Object', () => toggleSnapObject(), editor.snapObject);
        snapObjBtn.dataset.snap = 'object';
        snapGroup.appendChild(snapObjBtn);
      } else {
        snapGroup.style.display = 'none';
      }
    }

    function makeButton(icon, label, onClick, active) {
      const btn = document.createElement('button');
      btn.className = 'tb-btn' + (active ? ' active' : '');
      btn.innerHTML = '<span class="icon">' + icon + '</span><span class="label">' + label + '</span>';
      btn.title = label;
      btn.addEventListener('click', onClick);
      return btn;
    }

    function setActiveInGroup(group, mode) {
      group.querySelectorAll('.tb-btn').forEach((b) => {
        if (b.dataset.mode) b.classList.toggle('active', b.dataset.mode === mode);
      });
    }

    function setTransformMode(mode) {
      editor.transformMode = mode;
      if (!gizmoManager) return;
      gizmoManager.positionGizmoEnabled = mode === 'move';
      gizmoManager.rotationGizmoEnabled = mode === 'rotate';
      gizmoManager.scaleGizmoEnabled = mode === 'scale';

      if (gizmoManager.gizmos.positionGizmo) {
        gizmoManager.gizmos.positionGizmo.updateGizmoRotationToMatchAttachedMesh = (editor.referenceMode === 'object');
        gizmoManager.gizmos.positionGizmo.updateGizmoPositionToMatchAttachedMesh = true;
      }
      if (gizmoManager.gizmos.rotationGizmo) {
        gizmoManager.gizmos.rotationGizmo.updateGizmoRotationToMatchAttachedMesh = (editor.referenceMode === 'object');
      }
      if (gizmoManager.gizmos.scaleGizmo) {
        gizmoManager.gizmos.scaleGizmo.updateGizmoRotationToMatchAttachedMesh = (editor.referenceMode === 'object');
      }

      // ⭐ حالا که gizmo ساخته شده، listener بهش ببند
      setupGizmoSync();

      if (selectedIds.length > 0) attachGizmoTo(selectedIds[0]);
      setActiveInGroup(transformGroup, mode);
      setStatus('● Transform: ' + mode, true);
    }

    function setReferenceMode(mode) {
      editor.referenceMode = mode;
      setTransformMode(editor.transformMode);
      setActiveInGroup(refGroup, mode);
      setStatus('● Space: ' + mode, true);
    }

    function setShaderMode(mode) {
      editor.shaderMode = mode;
      scene.meshes.forEach((m) => {
        if (!m.material || m.name === '__grid') return;
        if (m.name.endsWith('_g')) return;
        if (m.material.wireframe !== undefined) {
          m.material.wireframe = (mode === 'wireframe' || mode === 'both');
        }
        m.material.alpha = (mode === 'both') ? 0.85 : 1;
      });
      setActiveInGroup(shaderGroup, mode);
      setStatus('● View: ' + mode, true);
    }

    function toggleSnapGrid() {
      editor.snapGrid = !editor.snapGrid;
      const btn = snapGroup.querySelector('[data-snap="grid"]');
      if (btn) btn.classList.toggle('active', editor.snapGrid);
      setStatus('● Snap Grid: ' + (editor.snapGrid ? 'ON (' + editor.snapGridSize + ')' : 'OFF'), true);
    }

    function toggleSnapObject() {
      editor.snapObject = !editor.snapObject;
      const btn = snapGroup.querySelector('[data-snap="object"]');
      if (btn) btn.classList.toggle('active', editor.snapObject);
      setStatus('● Snap Object: ' + (editor.snapObject ? 'ON' : 'OFF'), true);
    }

    function addObject(geometry) {
      const name = geometry.charAt(0).toUpperCase() + geometry.slice(1);
      vscode.postMessage({
        type: 'add:node',
        payload: {
          name,
          components: [{
            type: 'mesh',
            geometry,
            material: { color: '#6B46C1', metallic: 0.2, roughness: 0.6 },
          }],
          transform: {
            position: { x: 0, y: 0, z: 0 },
            rotation: { x: 0, y: 0, z: 0, w: 1 },
            scale: { x: 1, y: 1, z: 1 },
          },
        },
      });
      setStatus('● Added ' + name, true);
    }

    function setupGizmo() {
      gizmoManager = new BABYLON.GizmoManager(scene);
      gizmoManager.usePointerToAttachGizmos = false;
      gizmoManager.positionGizmoEnabled = true;
      gizmoManager.rotationGizmoEnabled = false;
      gizmoManager.scaleGizmoEnabled = false;
      gizmoManager.boundingBoxGizmoEnabled = false;

      const ratio = config?.gizmo?.scaleRatio ?? 1.0;
      if (gizmoManager.gizmos.positionGizmo) {
        gizmoManager.gizmos.positionGizmo.updateGizmoRotationToMatchAttachedMesh = false;
        gizmoManager.gizmos.positionGizmo.updateGizmoPositionToMatchAttachedMesh = true;
        gizmoManager.gizmos.positionGizmo.scaleRatio = ratio;
      }
      if (gizmoManager.gizmos.rotationGizmo) gizmoManager.gizmos.rotationGizmo.scaleRatio = ratio;
      if (gizmoManager.gizmos.scaleGizmo) gizmoManager.gizmos.scaleGizmo.scaleRatio = ratio;
    }

    function setupGizmoSync() {
      if (!gizmoManager) return;

      const postTransform = (attached, live) => {
        if (suppressGizmoSync) return;
        const nodeId = meshToNodeId.get(attached) || rootToNodeId.get(attached);
        if (!nodeId) return;
        const worldPos = attached.getAbsolutePosition();
        const worldScale = attached.absoluteScaling || attached.scaling;
        const q = attached.rotationQuaternion || BABYLON.Quaternion.FromEulerVector(attached.rotation);
        vscode.postMessage({
          type: 'update:transform',
          nodeId,
          transform: {
            position: { x: worldPos.x, y: worldPos.y, z: worldPos.z },
            rotation: { x: q.x, y: q.y, z: q.z, w: q.w },
            scale: { x: worldScale.x, y: worldScale.y, z: worldScale.z },
          },
          source: 'viewport',
          live,
        });
      };

      const attach = (gizmoName) => {
        const gizmo = gizmoManager.gizmos[gizmoName];
        if (!gizmo) return;
        // ⭐ اگه قبلاً listener بستیم، دوباره نبند
        if (gizmoListenersAttached.has(gizmo)) return;
        gizmoListenersAttached.add(gizmo);

        let dragThrottle = null;
        gizmo.onDragObservable.add(() => {
          if (dragThrottle) return;
          dragThrottle = setTimeout(() => {
            dragThrottle = null;
            const target = gizmo.attachedNode || gizmoManager.attachedMesh;
            if (target) postTransform(target, true);
          }, 16);
        });

        gizmo.onDragEndObservable.add(() => {
          if (dragThrottle) {
            clearTimeout(dragThrottle);
            dragThrottle = null;
          }
          const target = gizmo.attachedNode || gizmoManager.attachedMesh;
          if (target) postTransform(target, false);
        });

        log('gizmoSync attached:', gizmoName);
      };

      attach('positionGizmo');
      attach('rotationGizmo');
      attach('scaleGizmo');
    }

    function attachGizmoTo(nodeId) {
      if (!gizmoManager) return;
      const target = nodeIdToRoot.get(nodeId) || nodeIdToMesh.get(nodeId);
      if (!target) {
        gizmoManager.attachToMesh(null);
        return;
      }

      if (target.getClassName && target.getClassName() === 'TransformNode') {
        if (gizmoManager.gizmos.positionGizmo) gizmoManager.gizmos.positionGizmo.attachedNode = target;
        if (gizmoManager.gizmos.rotationGizmo) gizmoManager.gizmos.rotationGizmo.attachedNode = target;
        if (gizmoManager.gizmos.scaleGizmo) gizmoManager.gizmos.scaleGizmo.attachedNode = target;
      } else {
        gizmoManager.attachToMesh(target);
      }
    }

    function detachGizmo() {
      if (!gizmoManager) return;
      gizmoManager.attachToMesh(null);
      if (gizmoManager.gizmos.positionGizmo) gizmoManager.gizmos.positionGizmo.attachedNode = null;
      if (gizmoManager.gizmos.rotationGizmo) gizmoManager.gizmos.rotationGizmo.attachedNode = null;
      if (gizmoManager.gizmos.scaleGizmo) gizmoManager.gizmos.scaleGizmo.attachedNode = null;
    }

    function applyTransformFromInspector(payload) {
      if (!payload) return;
      const { nodeId, transform } = payload;

      const root = nodeIdToRoot.get(nodeId);
      const pickable = nodeIdToMesh.get(nodeId);
      if (!root && !pickable) return;

      suppressGizmoSync = true;
      try {
        if (root) {
          if (transform.position) {
            root.position.set(transform.position.x, transform.position.y, transform.position.z);
          }
          if (transform.rotation) {
            root.rotationQuaternion = new BABYLON.Quaternion(
              transform.rotation.x,
              transform.rotation.y,
              transform.rotation.z,
              transform.rotation.w,
            );
          }
          if (transform.scale) {
            root.scaling.set(transform.scale.x, transform.scale.y, transform.scale.z);
          }
        }

        if (pickable && pickable !== root) {
          pickable.position.set(0, 0, 0);
          pickable.rotationQuaternion = BABYLON.Quaternion.Identity();
        }
      } finally {
        setTimeout(() => { suppressGizmoSync = false; }, 0);
      }
    }

    function applyRotation() {
      const cp = Math.cos(camState.pitch);
      const dir = new BABYLON.Vector3(
        cp * Math.sin(camState.yaw),
        Math.sin(camState.pitch),
        cp * Math.cos(camState.yaw),
      );
      camera.setTarget(camera.position.add(dir));
    }

    function rotate(dx, dy) {
      camState.yaw += dx * MOUSE_SENS;
      camState.pitch -= dy * MOUSE_SENS;
      camState.pitch = Math.max(-1.55, Math.min(1.55, camState.pitch));
      applyRotation();
    }

    function setupInput() {
      document.addEventListener('contextmenu', (e) => e.preventDefault(), { capture: true });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        camState.baseSpeed *= e.deltaY > 0 ? 0.9 : 1.1;
        camState.baseSpeed = Math.max(0.05, Math.min(20, camState.baseSpeed));
        setStatus('● Speed: ' + camState.baseSpeed.toFixed(2), true);
      }, { passive: false });

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0 && !lookMode) canvas.focus();
      });

      document.addEventListener('mousemove', (e) => {
        if (!lookMode) return;
        if (!pointerLocked) return;
        rotate(e.movementX, e.movementY);
      });

      let fallbackX = 0, fallbackY = 0;
      window.addEventListener('mousemove', (e) => {
        if (!lookMode) return;
        if (pointerLocked) return;
        const dx = e.clientX - fallbackX;
        const dy = e.clientY - fallbackY;
        fallbackX = e.clientX;
        fallbackY = e.clientY;
        rotate(dx, dy);
      });

      lookModeBtn.addEventListener('click', () => {
        toggleLookMode();
      });

      canvas.addEventListener('mousedown', (e) => {
        if (lookMode) e.preventDefault();
      }, { capture: true });

      window.addEventListener('keydown', (e) => {
        if (e.target && e.target.tagName === 'INPUT') return;

        const code = e.code;

        if (code === 'KeyF') {
          e.preventDefault();
          e.stopPropagation();
          toggleLookMode();
          return;
        }

        if (code === 'Delete' || code === 'Backspace') {
          if (selectedIds.length > 0) {
            e.preventDefault();
            e.stopPropagation();
            for (const id of selectedIds) {
              vscode.postMessage({ type: 'remove:node', nodeId: id });
            }
          }
          return;
        }

        if (code === 'Escape') {
          if (lookMode) exitLookMode();
          else vscode.postMessage({ type: 'select', ids: [] });
          return;
        }

        if ((e.ctrlKey || e.metaKey) && code === 'KeyD') {
          if (selectedIds.length > 0) {
            e.preventDefault();
            e.stopPropagation();
            for (const id of selectedIds) {
              vscode.postMessage({ type: 'duplicate:node', nodeId: id });
            }
          }
          return;
        }

        // ⭐ hotkeys برای transform mode
        if (!lookMode && !e.ctrlKey && !e.metaKey) {
          if (code === 'KeyG') { setTransformMode('move'); return; }
          if (code === 'KeyR') { setTransformMode('rotate'); return; }
          if (code === 'KeyT') { setTransformMode('scale'); return; }
        }

        if (!lookMode) return;

        const handled =
          code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD' ||
          code === 'KeyQ' || code === 'KeyE' ||
          code === 'KeyI' || code === 'KeyJ' || code === 'KeyK' || code === 'KeyL' ||
          code === 'ArrowUp' || code === 'ArrowDown' ||
          code === 'ArrowLeft' || code === 'ArrowRight' ||
          code === 'Space' ||
          code === 'ShiftLeft' || code === 'ShiftRight';

        if (handled) {
          e.preventDefault();
          e.stopPropagation();
        }

        keys.add(code);
        if (code === 'ShiftLeft' || code === 'ShiftRight') shiftHeld = true;
        if (code === 'Space') spaceHeld = true;
      }, { capture: true });

      window.addEventListener('keyup', (e) => {
        const code = e.code;

        keys.delete(code);
        if (code === 'ShiftLeft' || code === 'ShiftRight') shiftHeld = false;
        if (code === 'Space') spaceHeld = false;

        if (!lookMode) return;

        if (
          code === 'KeyW' || code === 'KeyA' || code === 'KeyS' || code === 'KeyD' ||
          code === 'KeyQ' || code === 'KeyE' ||
          code === 'KeyI' || code === 'KeyJ' || code === 'KeyK' || code === 'KeyL' ||
          code === 'ArrowUp' || code === 'ArrowDown' ||
          code === 'ArrowLeft' || code === 'ArrowRight' ||
          code === 'Space'
        ) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, { capture: true });

      window.addEventListener('blur', () => {
        keys.clear();
        shiftHeld = false;
        spaceHeld = false;
      });
    }

    function updateCamera(dt) {
      if (!lookMode) return;

      const lookMult = shiftHeld ? camState.sprintMult : (spaceHeld ? camState.slowMult : 1);
      const lookStep = camState.baseLookSpeed * lookMult * dt;

      let rotated = false;
      if (keys.has('KeyJ') || keys.has('ArrowLeft')) { camState.yaw -= lookStep; rotated = true; }
      if (keys.has('KeyL') || keys.has('ArrowRight')) { camState.yaw += lookStep; rotated = true; }
      if (keys.has('KeyI') || keys.has('ArrowUp')) { camState.pitch += lookStep; rotated = true; }
      if (keys.has('KeyK') || keys.has('ArrowDown')) { camState.pitch -= lookStep; rotated = true; }

      if (rotated) {
        camState.pitch = Math.max(-1.55, Math.min(1.55, camState.pitch));
        applyRotation();
      }

      if (keys.size === 0) return;

      const moveMult = shiftHeld ? camState.sprintMult : (spaceHeld ? camState.slowMult : 1);
      const speed = camState.baseSpeed * moveMult * dt * 60;

      const fwd = camera.getDirection(BABYLON.Axis.Z);
      const right = camera.getDirection(BABYLON.Axis.X);

      const move = BABYLON.Vector3.Zero();
      if (keys.has('KeyW')) move.addInPlace(fwd);
      if (keys.has('KeyS')) move.subtractInPlace(fwd);
      if (keys.has('KeyD')) move.addInPlace(right);
      if (keys.has('KeyA')) move.subtractInPlace(right);
      if (keys.has('KeyE')) move.y += 1;
      if (keys.has('KeyQ')) move.y -= 1;

      if (move.lengthSquared() > 0) {
        move.normalize().scaleInPlace(speed);
        camera.position.addInPlace(move);
      }
    }

    function applySnap() {
      const mesh = selectedIds[0] ? (nodeIdToRoot.get(selectedIds[0]) || nodeIdToMesh.get(selectedIds[0])) : null;
      if (!mesh) return;

      const gizmoActive = gizmoManager && (
        gizmoManager.gizmos.positionGizmo?.isHovered ||
        gizmoManager.gizmos.positionGizmo?.isDragging ||
        gizmoManager.gizmos.rotationGizmo?.isHovered ||
        gizmoManager.gizmos.rotationGizmo?.isDragging ||
        gizmoManager.gizmos.scaleGizmo?.isHovered ||
        gizmoManager.gizmos.scaleGizmo?.isDragging
      );
      if (!gizmoActive) return;

      if (editor.snapGrid) {
        const g = editor.snapGridSize;
        mesh.position.x = Math.round(mesh.position.x / g) * g;
        mesh.position.y = Math.round(mesh.position.y / g) * g;
        mesh.position.z = Math.round(mesh.position.z / g) * g;
      }

      if (editor.snapObject) {
        const threshold = config?.toolbar?.snap?.object?.threshold ?? 0.3;
        for (const other of scene.meshes) {
          if (other === mesh) continue;
          if (other.name === '__grid') continue;
          if (!meshToNodeId.has(other)) continue;
          const d = BABYLON.Vector3.Distance(mesh.position, other.position);
          if (d < threshold) {
            mesh.position.copyFrom(other.position);
            break;
          }
        }
      }
    }

    function buildNode(nodeData, parentRoot) {
      const mc = (nodeData.components || []).find(c => c.type === 'mesh');
      const lc = (nodeData.components || []).find(c => c.type === 'light');
      const cc = (nodeData.components || []).find(c => c.type === 'camera');

      const root = new BABYLON.TransformNode(nodeData.id + '__root', scene);

      let pickable = null;
      if (mc) {
        switch (mc.geometry) {
          case 'box': pickable = BABYLON.MeshBuilder.CreateBox(nodeData.id, { size: 1 }, scene); break;
          case 'sphere': pickable = BABYLON.MeshBuilder.CreateSphere(nodeData.id, { diameter: 1 }, scene); break;
          case 'plane': pickable = BABYLON.MeshBuilder.CreatePlane(nodeData.id, { size: 1 }, scene); break;
          case 'cylinder': pickable = BABYLON.MeshBuilder.CreateCylinder(nodeData.id, { height: 1, diameter: 1 }, scene); break;
          case 'torus': pickable = BABYLON.MeshBuilder.CreateTorus(nodeData.id, { diameter: 1, thickness: 0.3 }, scene); break;
          default: pickable = BABYLON.MeshBuilder.CreateBox(nodeData.id, { size: 1 }, scene);
        }
        const m = new BABYLON.StandardMaterial(nodeData.id + '_m', scene);
        try { m.diffuseColor = BABYLON.Color3.FromHexString(mc.material.color); }
        catch { m.diffuseColor = new BABYLON.Color3(0.42, 0.27, 0.76); }
        m.emissiveColor = m.diffuseColor.scale(0.15);
        pickable.material = m;
      } else if (lc) {
        pickable = BABYLON.MeshBuilder.CreateSphere(nodeData.id + '_g', { diameter: 0.35 }, scene);
        const gm = new BABYLON.StandardMaterial(nodeData.id + '_gm', scene);
        gm.emissiveColor = new BABYLON.Color3(1, 0.9, 0.4);
        gm.disableLighting = true;
        pickable.material = gm;
      } else if (cc) {
        pickable = BABYLON.MeshBuilder.CreateBox(nodeData.id + '_g', { size: 0.5 }, scene);
        const gm = new BABYLON.StandardMaterial(nodeData.id + '_gm', scene);
        gm.wireframe = true;
        gm.emissiveColor = new BABYLON.Color3(0.5, 0.8, 1);
        gm.disableLighting = true;
        pickable.material = gm;
      }

      if (pickable) {
        pickable.parent = root;
        pickable.position.set(0, 0, 0);
        pickable.rotationQuaternion = BABYLON.Quaternion.Identity();
        pickable.scaling.set(1, 1, 1);
      }

      if (pickable) {
        meshToNodeId.set(pickable, nodeData.id);
        nodeIdToMesh.set(nodeData.id, pickable);
      }
      nodeIdToRoot.set(nodeData.id, root);
      rootToNodeId.set(root, nodeData.id);

      const t = nodeData.transform;
      if (t) {
        root.position.set(t.position.x, t.position.y, t.position.z);
        root.rotationQuaternion = new BABYLON.Quaternion(t.rotation.x, t.rotation.y, t.rotation.z, t.rotation.w);
        root.scaling.set(t.scale.x, t.scale.y, t.scale.z);
      }

      if (parentRoot) {
        root.parent = parentRoot;
      }

      for (const child of nodeData.children ?? []) {
        buildNode(child, root);
      }
    }

    function rebuildScene(data) {
      detachGizmo();

      for (const [id, obj] of nodeIdToMesh) {
        try { obj.dispose(); } catch (e) { console.warn('[Weaver] dispose mesh failed', id, e); }
      }
      for (const [id, obj] of nodeIdToRoot) {
        try { obj.dispose(); } catch (e) { console.warn('[Weaver] dispose root failed', id, e); }
      }
      nodeIdToMesh.clear();
      nodeIdToRoot.clear();
      rootToNodeId.clear();

      for (const child of data.root.children ?? []) buildNode(child, null);

      applySelection(selectedIds);
    }

    function applySelection(ids) {
      selectedIds = ids || [];
      if (!highlightLayer) return;
      refreshHighlights();
      if (selectedIds.length > 0) attachGizmoTo(selectedIds[0]);
      else detachGizmo();
    }

    function refreshHighlights() {
      highlightLayer.removeAllMeshes();

      if (hoveredMesh && meshToNodeId.has(hoveredMesh)) {
        highlightLayer.addMesh(hoveredMesh, HOVER_COLOR);
      }

      for (const id of selectedIds) {
        const mesh = nodeIdToMesh.get(id);
        if (mesh && mesh.getClassName && mesh.getClassName().includes('Mesh')) {
          highlightLayer.removeMesh(mesh);
          highlightLayer.addMesh(mesh, SELECT_COLOR);
        }
      }
    }

    function setupPicking() {
      scene.onPointerObservable.add((pi) => {
        if (pi.type !== BABYLON.PointerEventTypes.POINTERMOVE) return;
        if (!scene) return;
        if (lookMode) return;

        const pick = scene.pick(scene.pointerX, scene.pointerY, (m) => {
          if (!m || !m.isPickable) return false;
          if (m.name === '__grid') return false;
          if (!meshToNodeId.has(m)) return false;
          return true;
        });

        const newHover = (pick && pick.hit && pick.pickedMesh) ? pick.pickedMesh : null;

        if (newHover !== hoveredMesh) {
          hoveredMesh = newHover;
          refreshHighlights();
          canvas.style.cursor = hoveredMesh ? 'pointer' : 'default';
        }
      });

      scene.onPointerObservable.add((pi) => {
        if (pi.type !== BABYLON.PointerEventTypes.POINTERPICK) return;
        if (pi.event.button !== 0) return;
        if (lookMode) return;

        const picked = pi.pickInfo?.pickedMesh;
        const nodeId = picked ? meshToNodeId.get(picked) : null;

        if (pi.event.ctrlKey || pi.event.metaKey || pi.event.shiftKey) {
          if (nodeId) {
            const current = new Set(selectedIds);
            if (current.has(nodeId)) current.delete(nodeId);
            else current.add(nodeId);
            vscode.postMessage({ type: 'select', ids: [...current] });
          }
        } else {
          vscode.postMessage({ type: 'select', ids: nodeId ? [nodeId] : [] });
        }
      });
    }
  </script>
</body>
